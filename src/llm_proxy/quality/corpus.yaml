- id: mixed-sentence
  tags: [positive, multiple, complex]
  input: "ФИО: Иван Петров, дата рождения 6 июня 1990, место рождения: город Казань, гражданство: Россия, паспорт 45 12 123456, код подразделения 770-001, паспорт выдан 12.03.2010 ОВД города Казани, водительское удостоверение 98 76 111111, адрес регистрации: 123456, Россия, Московская область, Ленинский район, город Самара, улица Баумана, дом 10, квартира 5, тел. +7 (900) 123-45-67, почта synthetic@example.test, ИНН 500100732259, карта 4111 1111 1111 1111, CVV 123, пин-код карты 4321, держатель карты Петр Сидоров."
  expected:
    - {type: person, text: "Иван Петров"}
    - {type: birth_date, text: "6 июня 1990"}
    - {type: birth_place, text: "город Казань"}
    - {type: citizenship, text: "Россия", occurrence: 1}
    - {type: passport, text: "45 12 123456"}
    - {type: passport_division_code, text: "770-001"}
    - {type: passport_issue_date, text: "12.03.2010"}
    - {type: passport_issuer, text: "ОВД города Казани"}
    - {type: driver_license, text: "98 76 111111"}
    - {type: address_postal_code, text: "123456", occurrence: 2}
    - {type: address_country, text: "Россия", occurrence: 2}
    - {type: address_region, text: "Московская область"}
    - {type: address_district, text: "Ленинский район"}
    - {type: address_city, text: "город Самара"}
    - {type: address_street, text: "улица Баумана"}
    - {type: address_house, text: "10", occurrence: 2}
    - {type: address_apartment, text: "5", occurrence: 4}
    - {type: phone, text: "+7 (900) 123-45-67"}
    - {type: email, text: synthetic@example.test}
    - {type: inn, text: "500100732259"}
    - {type: card, text: "4111 1111 1111 1111"}
    - {type: cvv, text: "123", occurrence: 4}
    - {type: pin, text: "4321"}
    - {type: cardholder, text: "Петр Сидоров"}

