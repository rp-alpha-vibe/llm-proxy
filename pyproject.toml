[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-proxy"
version = "0.1.0"
description = "HTTP module for protecting personal data before LLM calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "redis>=5.0,<6.0",
    "cryptography>=45.0,<46.0",
    "PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.26,<1.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
llm-proxy = "llm_proxy.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PTH", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["redis.*", "yaml.*", "prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true
