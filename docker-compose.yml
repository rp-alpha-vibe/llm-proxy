services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  app:
    build: .
    environment:
      LLM_PROXY_REDIS_URL: redis://redis:6379/0
      LLM_PROXY_ENCRYPTION_KEY: ${LLM_PROXY_ENCRYPTION_KEY:-}
      LLM_PROXY_CONFIG_PATH: /app/config/systems.example.yaml
      LLM_PROXY_DEFAULT_CONSUMER_ID: ${LLM_PROXY_DEFAULT_CONSUMER_ID:-alfa_tester}
      LLM_PROXY_SESSION_TTL_SECONDS: ${LLM_PROXY_SESSION_TTL_SECONDS:-900}
      LLM_PROXY_POST_DEMASK_TTL_SECONDS: ${LLM_PROXY_POST_DEMASK_TTL_SECONDS:-120}
      LLM_PROXY_MAX_CONCURRENCY: ${LLM_PROXY_MAX_CONCURRENCY:-100}
      LLM_PROXY_OVERLOAD_RETRY_AFTER_SECONDS: ${LLM_PROXY_OVERLOAD_RETRY_AFTER_SECONDS:-1}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
